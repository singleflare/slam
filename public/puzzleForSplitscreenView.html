<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body style='margin:0;overflow:hidden;left:-500px;position:absolute;top:0px;width:1920px;height:1080px;'>
  <img src="gpx/bg.png"
    style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; pointer-events: none;">
  <iframe src="puzzleOnly.html"
    style="width: 1920px; height: 1080px;position: absolute; top: -100px; left: 0; border: none;scale: .8;"></iframe>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
    integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const s = io();
    s.on('generateCrosswordGrid', (grid, isFinal) => {
      if (isFinal) {
        $('img').attr('src', 'gpx/bgFinale.png')
      }
      else {
        $('img').attr('src', 'gpx/bg.png')
      }
    })
  </script>
</body>

</html>
